name: RepairScout
options:
  bundleIdPrefix: com.humbertowgw
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    DEVELOPMENT_TEAM: 9RYL8ZRC3U
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: 5.0
targets:
  RepairScout:
    type: application
    platform: iOS
    sources:
      - path: RepairScout
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.humbertowgw.repairscout
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    info:
      path: RepairScout/Info.plist
      properties:
        UILaunchScreen: {}
        NSCameraUsageDescription: "RepairScout uses the camera to scan a vehicle's VIN plate or barcode instead of typing all 17 characters by hand."
schemes:
  RepairScout:
    build:
      targets:
        RepairScout: all
    run:
      config: Debug
