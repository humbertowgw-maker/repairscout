<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="cabinFilterTitle">
  <title id="cabinFilterTitle">Cabin air filter housing behind the glove box</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Housing -->
  <rect x="140" y="70" width="200" height="120" rx="10" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Housing door open -->
  <rect x="140" y="190" width="200" height="16" fill="#334155"/>

  <!-- Pleated filter -->
  <g stroke="#f97316" stroke-width="3" fill="none">
    <path d="M 160 90 L 175 160 L 190 90 L 205 160 L 220 90 L 235 160 L 250 90 L 265 160 L 280 90 L 295 160 L 310 90 L 320 160"/>
  </g>
  <rect x="150" y="80" width="180" height="12" fill="#334155"/>
  <rect x="150" y="158" width="180" height="12" fill="#334155"/>

  <!-- Airflow arrow -->
  <g stroke="#60a5fa" stroke-width="4" fill="#60a5fa">
    <line x1="240" y1="220" x2="240" y2="255"/>
    <path d="M 226 245 L 240 265 L 254 245 Z"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="360" y="90">Housing</text>
    <line x1="355" y1="85" x2="342" y2="90" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="60" y="130">Pleated filter</text>
    <line x1="110" y1="125" x2="158" y2="125" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="270" y="245">Airflow direction</text>
  </g>
</svg>
