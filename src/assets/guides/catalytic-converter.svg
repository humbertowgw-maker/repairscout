<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="catTitle">
  <title id="catTitle">Catalytic converter section of the exhaust system</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Pipe before -->
  <rect x="40" y="160" width="90" height="34" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Converter body -->
  <path d="M 120 130 L 340 130 Q 380 130 380 177 Q 380 224 340 224 L 120 224 Z" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
  <!-- Flange bolts -->
  <g fill="#94a3b8">
    <circle cx="130" cy="150" r="4"/>
    <circle cx="130" cy="204" r="4"/>
    <circle cx="335" cy="150" r="4"/>
    <circle cx="335" cy="204" r="4"/>
  </g>
  <!-- Pipe after -->
  <rect x="380" y="160" width="60" height="34" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Internal substrate hint -->
  <g stroke="#475569" stroke-width="1.5">
    <line x1="180" y1="145" x2="180" y2="209"/>
    <line x1="220" y1="140" x2="220" y2="214"/>
    <line x1="260" y1="140" x2="260" y2="214"/>
    <line x1="300" y1="145" x2="300" y2="209"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="150" y="100">Catalytic converter</text>
    <line x1="200" y1="105" x2="230" y2="130" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="60" y="245">Flange bolts</text>
    <line x1="100" y1="238" x2="128" y2="206" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="390" y="245">To muffler</text>
    <line x1="400" y1="238" x2="410" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
