<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="engineFilterTitle">
  <title id="engineFilterTitle">Engine air filter box connected to the intake tube</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Housing base -->
  <rect x="110" y="140" width="220" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Housing lid, lifted open -->
  <rect x="120" y="80" width="200" height="20" rx="6" fill="#334155" stroke="#475569" stroke-width="2" transform="rotate(-8 120 100)"/>

  <!-- Pleated filter element -->
  <g stroke="#f97316" stroke-width="3" fill="none">
    <path d="M 130 150 L 145 210 L 160 150 L 175 210 L 190 150 L 205 210 L 220 150 L 235 210 L 250 150 L 265 210 L 280 150 L 295 210 L 310 150"/>
  </g>

  <!-- Intake tube to throttle body -->
  <rect x="330" y="165" width="90" height="34" rx="14" fill="#1e293b" stroke="#64748b" stroke-width="3"/>
  <text x="375" y="187" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">TO ENGINE</text>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="60" y="70">Housing lid</text>
    <line x1="100" y1="65" x2="150" y2="85" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="60" y="250">Filter element</text>
    <line x1="110" y1="245" x2="150" y2="220" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="360" y="145">Intake tube</text>
    <line x1="365" y1="150" x2="365" y2="163" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
