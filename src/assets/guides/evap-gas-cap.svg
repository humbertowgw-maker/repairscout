<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="gasCapTitle">
  <title id="gasCapTitle">Fuel filler cap with gasket seated on the filler neck</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Filler neck -->
  <path d="M 210 260 L 210 150 Q 210 120 240 120 Q 270 120 270 150 L 270 260 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Cap -->
  <circle cx="240" cy="100" r="56" fill="#334155" stroke="#f97316" stroke-width="4"/>
  <circle cx="240" cy="100" r="40" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <g stroke="#64748b" stroke-width="3">
    <line x1="240" y1="70" x2="240" y2="80"/>
    <line x1="240" y1="120" x2="240" y2="130"/>
    <line x1="210" y1="100" x2="220" y2="100"/>
    <line x1="260" y1="100" x2="270" y2="100"/>
  </g>

  <!-- Gasket ring -->
  <ellipse cx="240" cy="148" rx="34" ry="8" fill="none" stroke="#fbbf24" stroke-width="4"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="330" y="70">Gas cap</text>
    <line x1="325" y1="65" x2="290" y2="80" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="330" y="150">Gasket</text>
    <line x1="325" y1="145" x2="276" y2="148" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="330" y="230">Filler neck</text>
    <line x1="325" y1="225" x2="272" y2="215" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
