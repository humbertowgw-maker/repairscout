<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="flatTireTitle">
  <title id="flatTireTitle">Vehicle wheel raised on a jack with lug nuts exposed</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Wheel -->
  <circle cx="220" cy="150" r="90" fill="#1e293b" stroke="#475569" stroke-width="6"/>
  <circle cx="220" cy="150" r="34" fill="#334155" stroke="#475569" stroke-width="4"/>
  <!-- Lug nuts -->
  <g fill="#f97316">
    <circle cx="220" cy="122" r="6"/>
    <circle cx="246" cy="138" r="6"/>
    <circle cx="246" cy="162" r="6"/>
    <circle cx="220" cy="178" r="6"/>
    <circle cx="194" cy="162" r="6"/>
    <circle cx="194" cy="138" r="6"/>
  </g>
  <!-- Flat/deflated shading at bottom -->
  <path d="M 150 210 Q 220 250 290 210" fill="none" stroke="#7f1d1d" stroke-width="6" stroke-linecap="round" opacity="0.7"/>

  <!-- Jack -->
  <path d="M 220 240 L 190 300 M 220 240 L 250 300 M 190 300 L 250 300" stroke="#94a3b8" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="195" y="228" width="50" height="16" rx="4" fill="#64748b"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="340" y="120">Lug nuts</text>
    <line x1="335" y1="115" x2="252" y2="138" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="340" y="200">Flat side</text>
    <line x1="335" y1="195" x2="280" y2="205" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="270" y="290">Jack</text>
    <line x1="265" y1="285" x2="248" y2="270" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
