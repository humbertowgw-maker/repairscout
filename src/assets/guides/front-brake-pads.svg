<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="brakeTitle">
  <title id="brakeTitle">Front brake assembly: rotor, caliper, and brake pads</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Rotor -->
  <circle cx="220" cy="160" r="98" fill="none" stroke="#475569" stroke-width="10"/>
  <circle cx="220" cy="160" r="98" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="2 6"/>
  <circle cx="220" cy="160" r="34" fill="#1e2d47" stroke="#475569" stroke-width="6"/>
  <circle cx="220" cy="160" r="10" fill="#0d1829" stroke="#475569" stroke-width="4"/>
  <!-- lug bolt holes -->
  <circle cx="220" cy="146" r="4" fill="#475569"/>
  <circle cx="233" cy="153" r="4" fill="#475569"/>
  <circle cx="233" cy="167" r="4" fill="#475569"/>
  <circle cx="207" cy="167" r="4" fill="#475569"/>
  <circle cx="207" cy="153" r="4" fill="#475569"/>

  <!-- Caliper -->
  <g>
    <rect x="255" y="105" width="70" height="110" rx="14" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
    <rect x="264" y="120" width="52" height="20" rx="4" fill="#334155"/>
    <rect x="264" y="180" width="52" height="20" rx="4" fill="#334155"/>
    <circle cx="270" cy="130" r="4" fill="#94a3b8"/>
    <circle cx="270" cy="190" r="4" fill="#94a3b8"/>
  </g>

  <!-- Brake pads (shown pulled slightly out for clarity) -->
  <g>
    <rect x="330" y="118" width="60" height="16" rx="3" fill="#f97316"/>
    <rect x="330" y="186" width="60" height="16" rx="3" fill="#f97316"/>
    <text x="360" y="129" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0d1829" font-weight="700">PAD</text>
    <text x="360" y="197" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#0d1829" font-weight="700">PAD</text>
  </g>

  <!-- Labels -->
  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="150" y="50">Rotor</text>
    <line x1="150" y1="56" x2="190" y2="95" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="290" y="80">Caliper</text>
    <line x1="290" y1="86" x2="288" y2="105" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="395" y="150">Brake pads</text>
    <line x1="395" y1="156" x2="392" y2="126" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="180" y="270">Caliper bolts</text>
    <line x1="220" y1="264" x2="264" y2="132" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  </g>
</svg>
