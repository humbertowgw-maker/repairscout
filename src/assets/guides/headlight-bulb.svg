<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="headlightTitle">
  <title id="headlightTitle">Rear of headlight housing showing bulb, clip, and connector</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Headlight housing (trapezoid, rear view) -->
  <path d="M 100 80 L 380 60 L 400 240 L 120 260 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Bulb socket opening -->
  <circle cx="250" cy="160" r="46" fill="#0d1829" stroke="#64748b" stroke-width="3"/>

  <!-- Bulb -->
  <ellipse cx="250" cy="160" rx="22" ry="30" fill="#334155" stroke="#f97316" stroke-width="3"/>
  <line x1="250" y1="130" x2="250" y2="150" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Retaining clip -->
  <path d="M 210 130 Q 250 105 290 130" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>

  <!-- Electrical connector -->
  <rect x="235" y="195" width="30" height="22" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <line x1="250" y1="217" x2="250" y2="245" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="330" y="110">Retaining clip</text>
    <line x1="325" y1="105" x2="285" y2="122" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="330" y="165">Bulb</text>
    <line x1="325" y1="160" x2="272" y2="160" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="290" y="250">Connector</text>
    <line x1="285" y1="245" x2="265" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
