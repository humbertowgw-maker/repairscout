<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="coilTitle">
  <title id="coilTitle">Ignition coil mounted on top of a spark plug</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Coil body -->
  <rect x="190" y="50" width="80" height="120" rx="10" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
  <rect x="200" y="64" width="60" height="14" rx="3" fill="#334155"/>
  <rect x="200" y="84" width="60" height="14" rx="3" fill="#334155"/>
  <rect x="200" y="104" width="60" height="14" rx="3" fill="#334155"/>

  <!-- Electrical connector -->
  <rect x="260" y="70" width="34" height="26" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <line x1="294" y1="83" x2="330" y2="83" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>

  <!-- Rubber boot -->
  <path d="M 205 170 L 255 170 L 248 205 L 212 205 Z" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <!-- Spark plug beneath -->
  <rect x="218" y="205" width="24" height="30" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <rect x="224" y="235" width="12" height="40" fill="#334155" stroke="#475569" stroke-width="2"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="100" y="70">Coil</text>
    <line x1="125" y1="65" x2="188" y2="80" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="335" y="90">Connector</text>
    <line x1="330" y1="85" x2="296" y2="83" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="100" y="190">Boot</text>
    <line x1="125" y1="185" x2="210" y2="185" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="290" y="250">Spark plug</text>
    <line x1="285" y1="245" x2="242" y2="230" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
