<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="mafTitle">
  <title id="mafTitle">Mass airflow sensor inline with the intake tube</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Intake tube -->
  <rect x="60" y="130" width="360" height="60" rx="16" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- MAF sensor housing straddling the tube -->
  <rect x="205" y="90" width="70" height="140" rx="10" fill="#334155" stroke="#f97316" stroke-width="3"/>
  <!-- sensing element wire inside -->
  <line x1="240" y1="150" x2="240" y2="170" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>

  <!-- electrical connector -->
  <rect x="220" y="70" width="40" height="22" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>

  <!-- airflow arrow -->
  <g stroke="#60a5fa" stroke-width="4" fill="#60a5fa">
    <line x1="90" y1="160" x2="140" y2="160"/>
    <path d="M 130 150 L 150 160 L 130 170 Z"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="290" y="80">Connector</text>
    <line x1="285" y1="75" x2="262" y2="80" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="290" y="165">Sensing element</text>
    <line x1="285" y1="160" x2="245" y2="160" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="70" y="115">Airflow</text>

    <text x="90" y="255">Intake tube</text>
    <line x1="130" y1="248" x2="150" y2="192" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
