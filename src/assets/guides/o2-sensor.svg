<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="o2SensorTitle">
  <title id="o2SensorTitle">Oxygen sensor threaded into the exhaust pipe</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Exhaust pipe -->
  <rect x="60" y="150" width="360" height="50" rx="25" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Sensor body -->
  <rect x="215" y="90" width="30" height="60" fill="#334155" stroke="#f97316" stroke-width="3"/>
  <rect x="205" y="80" width="50" height="16" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>

  <!-- Wiring pigtail -->
  <path d="M 230 80 C 230 50, 280 60, 290 40" fill="none" stroke="#64748b" stroke-width="4" stroke-linecap="round"/>
  <rect x="282" y="28" width="30" height="20" rx="4" fill="#475569" stroke="#64748b" stroke-width="2"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="330" y="70">Wiring connector</text>
    <line x1="325" y1="65" x2="310" y2="40" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="270" y="115">O2 sensor</text>
    <line x1="265" y1="110" x2="247" y2="115" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="80" y="230">Exhaust pipe</text>
    <line x1="115" y1="225" x2="130" y2="200" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
