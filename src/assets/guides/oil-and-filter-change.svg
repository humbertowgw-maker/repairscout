<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="oilTitle">
  <title id="oilTitle">Engine oil pan with drain plug and spin-on oil filter</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Engine block outline -->
  <rect x="120" y="50" width="220" height="90" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Oil pan (trapezoid) -->
  <path d="M 140 140 L 320 140 L 290 210 L 170 210 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <!-- Drain plug -->
  <rect x="216" y="205" width="28" height="18" rx="3" fill="#f97316"/>

  <!-- Oil filter (cylinder on the side) -->
  <rect x="340" y="150" width="42" height="70" rx="8" fill="#1e293b" stroke="#f97316" stroke-width="3"/>
  <g stroke="#475569" stroke-width="1.5">
    <line x1="340" y1="165" x2="382" y2="165"/>
    <line x1="340" y1="180" x2="382" y2="180"/>
    <line x1="340" y1="195" x2="382" y2="195"/>
  </g>

  <!-- Dipstick -->
  <line x1="180" y1="60" x2="165" y2="230" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="181" cy="55" r="8" fill="#334155" stroke="#64748b" stroke-width="2"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="60" y="45">Dipstick</text>
    <line x1="95" y1="40" x2="178" y2="58" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="330" y="140">Oil filter</text>
    <line x1="335" y1="145" x2="365" y2="150" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="120" y="255">Drain plug</text>
    <line x1="160" y1="248" x2="225" y2="223" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
