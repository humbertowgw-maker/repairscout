<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="beltTitle">
  <title id="beltTitle">Serpentine belt routed around engine pulleys</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Pulleys -->
  <circle cx="150" cy="110" r="34" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <circle cx="330" cy="110" r="26" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <circle cx="240" cy="230" r="44" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <circle cx="370" cy="220" r="20" fill="#1e293b" stroke="#f97316" stroke-width="3"/>

  <!-- Belt path (approximate loop around all pulleys) -->
  <path d="M 150 76 L 330 84
           A 26 26 0 0 1 356 110
           L 388 205
           A 20 20 0 0 1 372 240
           L 278 262
           A 44 44 0 0 1 202 262
           L 122 138
           A 34 34 0 0 1 150 76 Z"
        fill="none" stroke="#f97316" stroke-width="6" stroke-linejoin="round"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="40" y="70">Alternator pulley</text>
    <line x1="100" y1="75" x2="130" y2="95" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="330" y="60">A/C pulley</text>
    <line x1="335" y1="65" x2="332" y2="84" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="150" y="300">Crankshaft pulley</text>
    <line x1="200" y1="295" x2="220" y2="270" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="395" y="255">Tensioner</text>
    <line x1="392" y1="248" x2="380" y2="232" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
