<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="starterTitle">
  <title id="starterTitle">Starter motor with solenoid and battery cable</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Motor body (cylinder) -->
  <rect x="120" y="150" width="180" height="70" rx="35" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Solenoid (smaller cylinder on top) -->
  <rect x="180" y="105" width="110" height="50" rx="24" fill="#334155" stroke="#f97316" stroke-width="3"/>

  <!-- Mounting flange with bolts -->
  <rect x="290" y="140" width="30" height="90" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <circle cx="305" cy="158" r="4" fill="#94a3b8"/>
  <circle cx="305" cy="212" r="4" fill="#94a3b8"/>

  <!-- Battery cable terminal -->
  <rect x="95" y="175" width="26" height="20" rx="4" fill="#dc2626" stroke="#fca5a5" stroke-width="2"/>
  <line x1="70" y1="185" x2="95" y2="185" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

  <!-- Small solenoid trigger wire -->
  <line x1="200" y1="105" x2="190" y2="80" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
  <rect x="180" y="65" width="22" height="16" rx="3" fill="#475569" stroke="#64748b" stroke-width="2"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="185" y="60">Trigger wire</text>

    <text x="300" y="95">Solenoid</text>
    <line x1="295" y1="100" x2="270" y2="115" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="330" y="250">Mounting flange</text>
    <line x1="325" y1="243" x2="310" y2="220" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="50" y="230">Battery cable</text>
    <line x1="80" y1="222" x2="82" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
