<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="thermostatTitle">
  <title id="thermostatTitle">Thermostat housing at the upper radiator hose connection</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Engine block corner -->
  <rect x="60" y="60" width="140" height="120" rx="8" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Housing -->
  <path d="M 200 100 L 260 100 Q 290 100 290 130 L 290 150 Q 290 180 260 180 L 200 180 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Thermostat valve (circle inside housing) -->
  <circle cx="245" cy="140" r="26" fill="#334155" stroke="#f97316" stroke-width="4"/>
  <circle cx="245" cy="140" r="10" fill="#0d1829" stroke="#f97316" stroke-width="2"/>

  <!-- Radiator hose -->
  <path d="M 290 130 Q 340 110 380 130 L 380 170 Q 340 155 290 150" fill="none" stroke="#64748b" stroke-width="10" stroke-linecap="round"/>

  <!-- Radiator -->
  <rect x="380" y="80" width="50" height="150" rx="6" fill="#1e293b" stroke="#475569" stroke-width="3"/>
  <g stroke="#334155" stroke-width="2">
    <line x1="390" y1="90" x2="390" y2="220"/>
    <line x1="400" y1="90" x2="400" y2="220"/>
    <line x1="410" y1="90" x2="410" y2="220"/>
    <line x1="420" y1="90" x2="420" y2="220"/>
  </g>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="180" y="220">Thermostat</text>
    <line x1="205" y1="212" x2="235" y2="163" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="290" y="60">Upper radiator hose</text>
    <line x1="330" y1="65" x2="330" y2="112" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="80" y="50">Engine block</text>
  </g>
</svg>
