<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 320" width="480" height="320" role="img" aria-labelledby="bearingTitle">
  <title id="bearingTitle">Wheel hub and bearing assembly on the steering knuckle</title>
  <rect width="480" height="320" fill="#0d1829" rx="12"/>

  <!-- Knuckle -->
  <path d="M 140 90 L 260 90 L 280 230 L 200 260 L 130 220 Z" fill="#1e293b" stroke="#475569" stroke-width="3"/>

  <!-- Hub/bearing assembly -->
  <circle cx="240" cy="170" r="60" fill="#1e293b" stroke="#f97316" stroke-width="4"/>
  <circle cx="240" cy="170" r="38" fill="#334155" stroke="#64748b" stroke-width="3"/>
  <!-- ball bearings ring -->
  <g fill="#94a3b8">
    <circle cx="240" cy="140" r="4"/>
    <circle cx="266" cy="155" r="4"/>
    <circle cx="266" cy="185" r="4"/>
    <circle cx="240" cy="200" r="4"/>
    <circle cx="214" cy="185" r="4"/>
    <circle cx="214" cy="155" r="4"/>
  </g>
  <circle cx="240" cy="170" r="10" fill="#0d1829" stroke="#475569" stroke-width="2"/>

  <!-- Axle nut -->
  <rect x="330" y="155" width="34" height="30" fill="#475569" stroke="#64748b" stroke-width="2"/>
  <line x1="300" y1="170" x2="330" y2="170" stroke="#64748b" stroke-width="6"/>

  <g font-family="system-ui, sans-serif" font-size="13" fill="#e2e8f0">
    <text x="90" y="70">Knuckle</text>
    <line x1="120" y1="65" x2="155" y2="95" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="90" y="280">Hub / bearing</text>
    <line x1="150" y1="272" x2="200" y2="215" stroke="#94a3b8" stroke-width="1.5"/>

    <text x="360" y="140">Axle nut</text>
    <line x1="355" y1="145" x2="347" y2="157" stroke="#94a3b8" stroke-width="1.5"/>
  </g>
</svg>
